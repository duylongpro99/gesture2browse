<!doctype html>
<meta charset="utf-8">
<title>istrusted-guard</title>
<button data-dispatch-target>trusted only</button>
<script>
  document.querySelector('[data-dispatch-target]').addEventListener('click', (e) => {
    if (e.isTrusted) { window.__dispatchOk = true; }  // ignores untrusted synthetic events
  });
</script>
