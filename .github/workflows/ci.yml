name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Trust-boundary lint
        run: node scripts/lint/boundary-lint.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Bench e2e (headless on placeholder y4m)
        run: pnpm exec playwright test -c apps/playground/playwright.config.ts

      - name: Package extension
        run: pnpm --filter @gesture/extension zip

      - name: Upload extension zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: apps/extension/.output/*.zip
          if-no-files-found: warn

      - name: Upload bench CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv
          path: |
            apps/playground/**/*.csv
            test-results/**
          if-no-files-found: ignore
